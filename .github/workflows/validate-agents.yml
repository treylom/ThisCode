name: validate-agents
on:
  pull_request:
    paths:
      - '.agents/**'
      - 'agents.yaml'
      - 'schemas/**'
      - 'scripts/validate-agents.sh'
      - 'scripts/check-agents-index.mjs'
      - 'scripts/generate-agents-index.mjs'
      - 'scripts/run-shell-tests.mjs'
      - 'hermes-plugin/plugin.yaml'
      - 'hermes-plugin/__init__.py'
      - 'docs/HERMES-STATUS.md'
      - 'contracts/**'
      - 'scripts/km-version.sh'
      - 'tests/test-km-version.sh'
      - 'scripts/install-*.sh'
      - 'tests/installers-readonly.test.mjs'
      - 'tests/installers-tier-labels.test.mjs'
      - 'tests/test-install-*.sh'
      - 'scripts/healthcheck.sh'
      - 'tests/docs/**'
      - 'tests/benchmark/test-*.sh'
      - 'tests/init/test-*.sh'
      - 'tests/push/**'
      - 'tests/router/**'
      - 'tests/SHELL-TESTS.md'
      - 'docs/**'
      - 'hooks/meeting-stop-reread.sh'
      - 'commands/open-meeting.md'
      - 'tests/agents/**'
      - 'tests/init/meeting-protocol.test.mjs'
      # 2026-05-21 added — workflow / npm deps 자체 변경도 CI 재실행 trigger
      - '.github/workflows/validate-agents.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:  # 수동 trigger (gh workflow run / GitHub UI)

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validators
        run: |
          # 2026-05-21 fix: ESM import (`import yaml from 'js-yaml'`) needs LOCAL node_modules
          # — global install (`-g`) is not visible to ES module resolver. `npm ci` installs
          # devDependencies (js-yaml + ajv-cli + ajv-formats) into ./node_modules.
          npm ci
          # ajv-cli also needed on PATH for shell-script validators, keep -g install.
          npm install -g ajv-cli ajv-formats js-yaml
          sudo apt-get update
          # Published PDF regression tests need real text extraction, not file timestamps.
          sudo apt-get install -y jq ripgrep poppler-utils
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Schema validate (all .agents/*.yaml)
        run: bash scripts/validate-agents.sh

      - name: Index consistency
        run: |
          node scripts/generate-agents-index.mjs --apply
          node scripts/check-agents-index.mjs

      - name: Plugin sync (hermes-plugin/plugin.yaml ↔ .agents/*.yaml)
        run: bash tests/agents/test-plugin-sync.sh

      - name: Hermes runtime registrations and deferred entries
        run: bash tests/agents/test-hermes-runtime-manifest.sh

      - name: Reject an unadvertised Hermes registration
        run: |
          if bash tests/agents/test-hermes-runtime-manifest.sh --self-test; then
            echo "FAIL: an unadvertised runtime registration was accepted"
            exit 1
          else
            test "$?" -eq 1
          fi

      - name: Contract version checks
        run: bash tests/test-km-version.sh

      - name: Node regression tests
        run: npm test

      - name: Hermetic shell regression tests (explicit allowlist)
        run: node scripts/run-shell-tests.mjs

      - name: Clone-relative installer checks
        run: |
          bash tests/test-install-graphrag.sh
          bash tests/test-install-obsidian-cli.sh
          bash tests/test-install-vault-search.sh

      - name: Clone-relative documentation checks
        run: |
          bash tests/docs/test-glossary.sh
          bash tests/docs/test-manual-v2.sh

      - name: Meeting Stop hook fixture
        run: node --test tests/init/meeting-protocol.test.mjs

      - name: All-yamls test
        run: bash tests/agents/test-all-yamls.sh
