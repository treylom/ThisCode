name: thiscode
version: 1.0.0
description: "Discord/Slack bot harness for Claude Code: setup, bots, meetings, shared memory, model router (knowledge management via the km plugin)."
# Aggregated from .agents/*.yaml (source of truth — see scripts/generate-agents-index.mjs)
provides_tools:
  - claude_discode_bootstrap
  - claude_discode_meetings
  - claude_discode_codex_invoke
  - claude_discode_shared_memory
  - claude_discode_route_model
provides_hooks:
  - on_session_start
  - on_stop
provides_commands:
  - /thiscode:setup
author: treylom
homepage: https://github.com/treylom/ThisCode
license: MIT
platforms:
  - macos
  - linux
  - wsl
requires_env: []
metadata:
  hermes_status: "runtime subset: on_session_start drift-check hook; manifest-only tools/commands are deferred — see docs/HERMES-STATUS.md."
  contract_version: "0.3.0"
  contract_path: "contracts/search-fallback-4tier.md"
  agent_spec_version: "1.0.0"
  agent_spec_schema: "schemas/agent-spec.json"
  tier_order:
    - 1: GraphRAG
    - 2: Obsidian CLI
    - 3: Obsidian MCP
    - 4: text search (ripgrep/grep)
