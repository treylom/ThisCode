# create-bot — 단계마다 어디까지 자동인가
#
# 이 표가 기준이다. SKILL.md 의 «### Step» 머리줄과 이 표의 단계(id)가 하나라도
# 어긋나면 tests/init/automation-steps.test.mjs 가 떨어진다.
#
# mode
#   auto             ThisCode 가 끝까지 한다. 막히면 아래 «막혔을 때» 규칙을 따른다.
#   auto_then_human  ThisCode 가 먼저 한다. 자동 시도 3회가 다 실패한 뒤에만 사람에게 넘긴다.
#   human_only       사람만 할 수 있다(답하기 · 로그인 · 사람 확인 · 비밀번호).
#                    시도 횟수에 넣지 않고 바로 넘긴다.
# gate             scripts/install-gate.sh 에 넘기는 이름. auto_then_human 은 넘기기 직전에
#                  `install-gate.sh --handoff <gate>` 가 0 을 줘야 한다.
# human_stops      그 단계 안에서 사람만 하는 자리(관문 이름 · configs/install.yaml 명단과 1:1).
# asks             그 단계에서 사용자에게 묻는 것(일을 넘기는 것이 아니라 답을 받는 것).
# notice           대신 하기 «전에» 사용자에게 알리는 한 줄(묻고 멈추는 것이 아니라 알림 — 알리고 바로 한다).
# handoff          사람에게 넘길 때 그대로 쓰는 안내 문구. 화면 이름은 한국어 화면에서
#                  확인된 것만 한국어로 적고, 영어 화면 이름을 괄호로 붙인다.
# handoff_after_attempts
#                  자동 시도 3회가 다 실패해 넘길 때 쓰는 안내 문구. 이 칸이 있으면
#                  handoff 는 사람만 하는 자리(human_stops)에서 넘길 때만 쓴다.
#
# 값은 전부 한 줄 · 큰따옴표 문자열(시험이 줄 단위로 읽는다).

schema: "thiscode-automation-v1"
skill: "create-bot"

policy:
  attempts_before_handoff: "3"
  browser_order: "ego aside fallback"
  attempt_1: "고른 브라우저에서 화면을 다시 읽고(스냅샷) 그 단계를 다시 한다"
  attempt_2: "같은 브라우저에서 다른 길로 한다(다른 버튼 이름 · 키보드 · 주소로 바로 가기)"
  attempt_3: "다음 브라우저로 바꿔서 한다(ego lite → Aside → 그 밖 · scripts/browser-detect.mjs)"
  record: "시도마다 install-gate.sh --attempted <gate> <ok|fail> '<사유>'"
  record_never: "사유에는 화면에서 읽은 값(토큰 · 비밀번호 · 인증 코드 · 주소 전체)을 쓰지 않는다 — 무엇이 막았는지만"
  before_handoff: "install-gate.sh --handoff <gate> 가 0 을 준 뒤에만 넘긴다"
  handoff_must_say: "무엇을 세 번 시도했고 왜 안 됐는지 · 사용자가 할 일 한 가지 · 그 다음은 ThisCode 가 잇는다"

always_human:
  - gate: "browser_permission_prompt"
    when: "자동화 브라우저가 사이트 권한 창 · 기기 선택 창에서 «사용자 차례»로 멈출 때"
    reason: "권한을 허용하는 것은 사람 몫 — 대신 누르지 않는다"
    handoff: "브라우저가 사용자 차례로 멈췄습니다. ego lite 라면 창 오른쪽 위 숫자 버튼 → ‘Need your action’ 표시가 붙은 칸 → 뜬 창 처리 → 아래 ‘Return to agent’ 순서로 누르고, 다른 브라우저라면 화면에 뜬 권한 창을 처리한 뒤 말해 주세요."

steps:
  - id: "0"
    title: "사용자 인터뷰"
    mode: "human_only"
    kind: "answer"
    reason: "사용자만 아는 것을 묻는다"
    handoff: "질문 여섯 개에 답해 주세요(적어 둔 글을 붙여 넣어도 됩니다)."

  - id: "1"
    title: "봇 이름 입력"
    mode: "human_only"
    kind: "answer"
    reason: "이름은 사용자가 정한다"
    handoff: "봇 이름을 알려 주세요."

  - id: "2"
    title: "봇 디렉토리 생성"
    mode: "auto"
    reason: "로컬 폴더 만들기"

  - id: "3"
    title: "Discord 봇 생성 (개발자 포털)"
    mode: "auto_then_human"
    gate: "discord_manual_full_flow"
    reason: "포털 조작은 자동화 브라우저가 한다 — 아래 3/0 ~ 3/7 로 나눠 본다"
    handoff: "브라우저 도구를 세 번 붙이려 했는데 <사유>로 안 됐습니다. 그래서 직접 하시는 방법을 안내드립니다."

  - id: "3/0"
    title: "브라우저 자동 고르기"
    anchor: "0단계 — 브라우저 자동 탐색"
    mode: "auto"
    gate: "browser_tool_install"
    reason: "ego lite → Aside → 그 밖 순서로 스크립트(scripts/browser-detect.mjs)가 고른다 · 없으면 도구 설치를 시도한다"

  - id: "3/1"
    title: "개발자 포털 열기"
    anchor: "Discord 개발자 포털을 엽니다."
    mode: "auto_then_human"
    gate: "discord_portal_open"
    human_stops: "discord_portal_login"
    reason: "주소로 이동은 자동 · 로그인 화면이면 계정 정보라 사람만"
    handoff: "여기만 로그인해 주세요(필요하면 다단계 인증까지) — 그 다음은 제가 이어갑니다."
    handoff_after_attempts: "개발자 포털을 열려고 세 번 시도했는데 <사유>로 안 됐습니다. 브라우저에서 discord.com/developers/applications 를 직접 열어 주세요 — 그 다음은 제가 이어갑니다."

  - id: "3/2"
    title: "새 애플리케이션 만들기"
    anchor: "새 애플리케이션을 만듭니다."
    mode: "auto_then_human"
    gate: "discord_new_application"
    human_stops: "discord_hcaptcha"
    notice: "이 단계에서 Discord 개발자 이용약관·개발자 정책 동의 칸을 대신 체크하고 ‘만들기’를 누릅니다 — 원치 않으면 지금 말해 주세요."
    if_declined: "사용자가 ‘하지 마’라고 하면 동의 칸과 ‘만들기’는 사용자가 직접 누른다 — 막혀서 넘기는 것이 아니라 사용자가 고른 것이라 --handoff 를 부르지 않는다"
    reason: "«신규 애플리케이션» 누르기 · 이름 넣기 · 약관 동의 칸 체크 · «만들기» 누르기는 자동(먼저 알린다) · 사람 확인만 사람"
    handoff: "사람 확인(hCaptcha) 창이 떴습니다 — 한국어 화면이면 제목이 ‘잠깐! 로봇 아니고 사람 맞죠?’ 입니다. 그것만 풀어 주세요. 그 다음은 제가 이어갑니다."
    handoff_after_attempts: "새 애플리케이션을 만들려고 세 번 시도했는데 <사유>로 안 됐습니다. «신규 앱 만들기» 창을 직접 마쳐 주세요 — 이름을 넣고 아래 동의 칸을 체크한 뒤 «만들기»(Create)를 누르면 됩니다. 그 다음은 제가 이어갑니다."

  - id: "3/3"
    title: "봇 토큰 발급"
    anchor: "봇 토큰 발급을 시작합니다."
    mode: "auto_then_human"
    gate: "discord_reset_token"
    human_stops: "discord_reset_token_modal"
    once: "Reset Token 은 이 단계에서 한 번만 누른다 — 다시 시도할 때 다시 누르지 않는다"
    reason: "Bot 탭 · Reset Token 누르기 · 토큰 저장(값은 보지 않음)은 자동 · 비밀번호 창은 사람만"
    handoff: "비밀번호(필요하면 인증 코드)만 입력해 주세요 — 그 다음은 제가 이어갑니다."
    handoff_after_attempts: "토큰 발급 화면을 열려고 세 번 시도했는데 <사유>로 안 됐습니다. 왼쪽 ‘Bot’ 탭에서 ‘Reset Token’ 을 한 번만 눌러 주세요 — 그 다음은 제가 이어갑니다."

  - id: "3/4"
    title: "인텐트 두 개 켜기"
    anchor: "메시지 내용·서버 멤버 인텐트를 켭니다."
    mode: "auto_then_human"
    gate: "discord_intents"
    reason: "토글 두 개와 저장은 자동"
    handoff: "봇이 메시지를 읽는 데 필요한 설정(인텐트) 두 개를 켜려고 세 번 시도했는데 <사유>로 안 됐습니다. Bot 탭 아래 ‘Privileged Gateway Intents’ 에서 ‘Message Content Intent’ 와 ‘Server Members Intent’ 를 켜고 ‘Save Changes’ 를 눌러 주세요 — 그 다음은 제가 이어갑니다."

  - id: "3/5"
    title: "초대 주소 만들기"
    anchor: "초대 URL을 만듭니다"
    mode: "auto_then_human"
    gate: "discord_invite_url"
    reason: "범위와 권한 14종 고르기는 자동"
    handoff: "초대 주소를 만들려고 세 번 시도했는데 <사유>로 안 됐습니다. 제가 드리는 주소를 브라우저 주소 칸에 붙여 넣어 주세요 — 그 다음은 제가 이어갑니다."

  - id: "3/6"
    title: "봇을 서버에 초대"
    anchor: "봇을 서버에 초대합니다."
    mode: "auto_then_human"
    gate: "discord_invite_authorize"
    reason: "서버 고르기와 승인 누르기는 자동 · 데스크톱 앱 승인 창으로 넘어가면 세 번 시도 뒤 사람"
    handoff: "브라우저에서 승인하려고 세 번 시도했는데 승인 창이 데스크톱 Discord 앱으로 넘어가 안 됐습니다. 데스크톱 앱에 뜬 승인 창에서 ‘승인’을 눌러 주세요 — 그 다음은 제가 이어갑니다."

  - id: "3/7"
    title: "채널에 봇 추가"
    anchor: "채널에 봇을 추가합니다."
    mode: "auto_then_human"
    gate: "discord_channel_add"
    asks: "DM 전용인지 특정 채널인지"
    reason: "채널 편집 → 멤버 추가는 자동"
    handoff: "채널에 봇을 넣으려고 세 번 시도했는데 <사유>로 안 됐습니다. 그 채널 → 채널 편집 → 권한/멤버 → 봇 추가를 해 주세요 — 그 다음은 제가 이어갑니다."

  - id: "4"
    title: "봇 토큰 저장"
    mode: "auto_then_human"
    gate: "discord_token_save"
    keep_browser: "토큰 화면이 떠 있는 동안에는 브라우저를 바꾸지 않는다 · 저장이 세 번 안 되면 그때만 사람에게 넘기고 다시 발급이 필요하다고 한 줄로 말한다"
    reason: "복사 버튼 → 클립보드 → 파일 저장은 자동(값은 화면·대화에 남기지 않는다)"
    handoff: "토큰을 자동으로 저장하려고 세 번 시도했는데 <사유>로 안 됐습니다. 포털에서 토큰을 복사해 제가 여는 입력 칸에 붙여 넣어 주세요(대화 창에는 붙이지 마세요)."

  - id: "4.7"
    title: "access.json 직접 생성"
    mode: "auto_then_human"
    gate: "discord_user_id"
    reason: "사용자 ID 는 포털 응답 → 화면 순서로 자동으로 얻는다"
    handoff: "사용자 ID 를 자동으로 얻으려고 세 번 시도했는데 <사유>로 안 됐습니다. Discord 앱 → 설정 → 고급에서 개발자 모드를 켜고, 본인 프로필을 우클릭해 ‘사용자 ID 복사’ 로 복사한 뒤 알려 주세요 — 그 다음은 제가 이어갑니다."

  - id: "4.5"
    title: "페르소나·직무 프롬프트 고도화"
    mode: "auto"
    asks: "봇의 역할과 말투"
    reason: "/prompt 연동으로 초안을 만든다"

  - id: "5-A"
    title: "시그니처 코퍼스 수집"
    mode: "auto"
    asks: "모티브로 삼을 캐릭터"
    reason: "자료 찾기와 정리는 자동"

  - id: "4.9"
    title: "기존 레포 우선 탐색"
    mode: "auto"
    reason: "로컬 파일 찾기"

  - id: "5"
    title: "soul.md 틀 고르고 채우기"
    mode: "auto"
    asks: "틀 고르기"
    reason: "파일 쓰기는 자동"

  - id: "5.7"
    title: "옵시디언 위키 연결"
    mode: "auto"
    asks: "위키 폴더 경로(없으면 건너뜀)"
    reason: "경로 확인과 연결은 자동"

  - id: "6"
    title: "작업 폴더 결정 + CLAUDE.md 생성"
    mode: "auto"
    asks: "작업 폴더 자리 확인"
    reason: "폴더와 안내 파일 만들기는 자동"

  - id: "6.7"
    title: "봇 연결 3게이트 선검사"
    mode: "auto_then_human"
    gate: "discord_plugin_install"
    reason: "검사와 훅 등록 확인은 자동 · 빠진 것(디스코드 플러그인 · bun)은 설치를 먼저 시도한다"
    handoff: "디스코드 플러그인(또는 bun)을 설치하려고 세 번 시도했는데 <사유>로 안 됐습니다. 화면에 보이는 설치 명령 한 줄을 그대로 실행해 주세요 — 그 다음은 제가 이어갑니다."

  - id: "7"
    title: "claude 시동 안내"
    mode: "auto_then_human"
    gate: "bot_first_start"
    human_stops: "claude_workspace_trust_confirm"
    reason: "시동 명령 만들기와 안내는 자동 · 새 작업 폴더의 첫 확인 창(‘Quick safety check’)은 사람만"
    handoff: "새 작업 폴더라 ‘Quick safety check’ 확인 창이 떴습니다 — 1번을 고르고 Enter 를 눌러 주세요. 그 다음은 제가 이어갑니다."

  - id: "7.5"
    title: "한 단어 봇 런처 설치"
    mode: "auto"
    asks: "런처 설치 동의(Y/n · 기본 Y)"
    reason: "미리보기와 설치는 스크립트가 한다"
